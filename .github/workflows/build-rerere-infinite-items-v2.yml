name: Build Re-ReARPD Infinite Items APK v2

on:
  push:
    branches:
      - chatgpt-rerere-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out runner repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone exact Re-ReARranged v3.47.0 source
        run: |
          git clone --depth 1 --branch v3.47.0 https://github.com/ek-mk8034/Re-Re-ARranged-pixel-dungeon.git game
          mv game/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/blessings/clericTempleBlessing.java game/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/blessings/ClericTempleBlessing.java
          sed -i 's/play-services-games-v2:+/play-services-games-v2:20.1.2/g' game/android/build.gradle

      - name: Add the two infinite items
        env:
          PROVISION_B64: 
          SCROLL_B64: 
        run: |
          mkdir -p game/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/custom
          printf '%s' "$PROVISION_B64" | base64 -d > game/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/custom/EndlessProvision.java
          printf '%s' "$SCROLL_B64" | base64 -d > game/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/custom/EndlessScroll.java
          python3 - <<'PY_PATCH'
          from pathlib import Path
          p = Path('game/core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/HeroClass.java')
          s = p.read_text()
          import_anchor = 'import com.shatteredpixel.shatteredpixeldungeon.items.Item;\n'
          imports = (import_anchor
                     + 'import com.shatteredpixel.shatteredpixeldungeon.items.custom.EndlessProvision;\n'
                     + 'import com.shatteredpixel.shatteredpixeldungeon.items.custom.EndlessScroll;\n')
          if import_anchor not in s:
              raise SystemExit('HeroClass import anchor not found')
          s = s.replace(import_anchor, imports, 1)
          old = '\t\t\ti = new Food();\n\t\t\tif (!Challenges.isItemBlocked(i)) i.collect();'
          new = ('\t\t\ti = new EndlessProvision();\n'
                 '\t\t\tif (!Challenges.isItemBlocked(i)) i.collect();\n'
                 '\t\t\tnew EndlessScroll().collect();')
          if old not in s:
              raise SystemExit('Starting food block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY_PATCH

      - name: Create a one-off release signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/rere-mod.keystore \
            -storepass android \
            -keypass android \
            -alias rere_mod \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Re-ReARPD Custom Build, OU=Local Mod, O=Local Mod, L=Local, ST=Local, C=US"
          printf '%s\n' \
            'REARRANGED_STORE_FILE=/tmp/rere-mod.keystore' \
            'REARRANGED_STORE_PASSWORD=android' \
            'REARRANGED_KEY_ALIAS=rere_mod' \
            'REARRANGED_KEY_PASSWORD=android' >> game/gradle.properties

      - name: Build signed release APK
        working-directory: game
        run: |
          chmod +x gradlew
          ./gradlew android:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          APK="$(find game/android/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" out/Re-ReARPD-v3.47.0-Infinite-Items.apk
          sha256sum out/Re-ReARPD-v3.47.0-Infinite-Items.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Re-ReARPD-v3.47.0-Infinite-Items-v2
          path: out/
          if-no-files-found: error
          retention-days: 7
